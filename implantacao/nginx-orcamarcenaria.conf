# nginx da VPS (D029): serve o front-end compilado e repassa /api para a API Node na porta 3333.
# Troque ENDERECO pelo endereço público (ex.: 203-0-113-10.sslip.io) antes de copiar para
# /etc/nginx/sites-available/orcamarcenaria. O certbot acrescenta o HTTPS depois (RNF14).
server {
    listen 80;
    server_name ENDERECO;

    # Achado A3 do diagnóstico de segurança: não revelar a versão do nginx e mandar cabeçalhos de segurança.
    # Atenção: o nginx não herda add_header para um location que declare o seu próprio (como /assets/ abaixo);
    # tudo bem, porque a CSP importa nas páginas HTML, que são servidas pelo location /.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Fontes do Google (index.html) e estilos em linha do React estão liberados; todo o resto é só do próprio site.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/orcamarcenaria/frontend/dist;
    index index.html;

    # API: /api/auth/entrar chega na API como /auth/entrar (a barra final do proxy_pass tira o /api).
    location /api/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Telas do React: qualquer caminho que não seja arquivo volta para o index.html.
    location / {
        try_files $uri /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
