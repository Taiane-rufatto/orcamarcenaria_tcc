  /servicos/{id}:
    put: { summary: Edita serviço próprio, security: [{ bearerAuth: [] }] }
    delete: { summary: Inativa serviço próprio, security: [{ bearerAuth: [] }] }
  /servicos/{id}/reativar:
    post: { summary: Reativa serviço próprio inativo, security: [{ bearerAuth: [] }] }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
